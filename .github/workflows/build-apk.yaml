name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil codingan dari repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (Wajib untuk build Android/Gradle)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Java 17 standar untuk Gradle terbaru, jika gagal coba ubah ke '11'

      # 3. Setup Flutter Environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Biar build selanjutnya lebih cepat

      # 4. Install Dependencies
      - name: Get Dependencies
        run: flutter pub get

      # 5. FIX UMUM: Kasih izin execute ke gradlew (Seringkali ini penyebab errornya!)
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 6. Build APK (Release version)
      # --release: membuat versi release (lebih ringan & cepat)
      # --no-tree-shake-icons: opsional, kadang mencegah error icon
      - name: Build APK
        run: flutter build apk --release

      # 7. Upload APK ke Artifacts (Supaya bisa didownload setelah selesai)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk